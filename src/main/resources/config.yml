spawn-on-join: false
myworlds-spawn-sync: true # Push the global spawn into MyWorlds so world spawn matches /setspawn.
respawn-at-home: true
newbies:
  spawnpoint: newbie
login-safety:
  enabled: true
  # Only these SMP dimensions are normalized, and respawns are kept inside them.
  # Add other survival worlds explicitly.
  worlds:
    - world
    - world_nether
    - world_the_end
  autopsy-migration:
    enabled: true
  # Return every non-survival login to survival unless the player is exempt below.
  normalize-non-staff-gamemode: true
  remove-flight-on-normalize: true
  # Seconds of invulnerability when a rescue cannot run, so a failure never leaves a player stuck or dead.
  failed-rescue-grace-seconds: 30
  # Fallback rules, used only when GameModeInventories-OG (the gamemode authority) is absent.
  # Holding one of these keeps a creative or spectator login inside the creative regions below (or with gamemodeinventories.anywhere); adventure is never kept.
  gamemode-exemption-permissions:
    creative:
      - noclip.use
      - gamemodeinventories.toggle
      - gamemodeinventories.anywhere
    spectator:
      - noclip.use
      - gamemodeinventories.spectator
  # Also fallback only. With GameModeInventories-OG loaded, its creative_regions
  # list is what counts.
  creative-regions:
    - spawn
  # Holders of spawnog.login-migration.bypass resume flight in place on relog when
  # still permitted to fly there, and are exempt from autopsy migration.
flight:
  enabled: true
  regions:
    spawn: fly
    warzone: nofly
spawnback:
  # Seconds the second /spawnback has to arrive after the warning.
  confirm-seconds: 30
locale:
  # <seconds> is replaced with the teleport warmup length.
  spawnWarmup: "<gold>Teleporting to spawn in <red><seconds> seconds...</red></gold>"
  # Movement cancels the warmup. Taking damage does not.
  spawnCancelled: "<red>Teleport to spawn cancelled because you moved.</red>"
  missingPermission: "<red>You are lacking the required permissions.</red>"
  unsafeLogin: "<gold>You logged in at an unsafe location (<red><x>, <y>, <z></red> in <world>) and were teleported to spawn.</gold>"
  # Sent to a player rescued to spawn because they logged out mid-flight.
  flyingRescue: "<gold>You logged out mid-flight at <red><x>, <y>, <z></red> in <world> and were brought to spawn.</gold>"
  # Sent when a bypass holder's flight is resumed in place instead of a rescue.
  flightResumed: "<gold>Welcome back. Your flight was resumed where you left.</gold>"
  autopsyMigration: "<gold>Your OG:SMP autopsy state was safely migrated from <red><x>, <y>, <z></red> in <world>. You were moved to spawn and returned to survival.</gold>"
  gamemodeNormalized: "<gold>Your login gamemode was safely returned to survival.</gold>"
  loginSafetyFailed: "<red>Your login safety migration could not finish safely. Please contact staff.</red>"
  returnAvailable: "<gold>Run <click:run_command:'/spawnback'><hover:show_text:'<gold>Click to run <red>/spawnback</red></gold>'><red>/spawnback</red></hover></click> if you want to go back there anyway.</gold>"
  # Sent when the return record could not be written after a rescue.
  returnRecordFailed: "<red>Your way back could not be saved. Staff have been notified.</red>"
  # First /spawnback. <reason> explains the rescue, <seconds> is the confirmation window.
  spawnbackWarning: "<gold>You were moved from <red><x>, <y>, <z></red> in <world> because <red><reason></red>. Run <click:run_command:'/spawnback'><hover:show_text:'<gold>Click to run <red>/spawnback</red> again</gold>'><red>/spawnback</red></hover></click> again within <seconds> seconds to go back anyway; you may take damage or die.</gold>"
  # Appended to the warning when the player's flight cannot be restored there.
  spawnbackFallWarning: "<gold>You can no longer fly there, so you will fall; a one-time fall protection will cover the landing.</gold>"
  spawnbackExecuted: "<gold>Returning you to <red><x>, <y>, <z></red> in <world>. Good luck.</gold>"
  # Sent when a plain return had to move up to the nearest clear spot above the recorded location.
  spawnbackAdjusted: "<gold>The spot you left was no longer safe to stand in, so you were placed at the nearest safe location above it.</gold>"
  # Sent when the return point forbids the player's prior mode of flight.
  # Fall damage is cancelled once on any return that restores no flight.
  returnFlightDenied: "<gold>You don't have the authority to fly here.</gold>"
  returnNone: "<red>You have no location to return to.</red>"
  returnWorldMissing: "<red>The world you were in (<world>) is not loaded, so you cannot return there.</red>"
  returnBusy: "<red>Your login is still being made safe. Try again in a few seconds.</red>"
  returnFailed: "<red>Your return teleport failed.</red>"
  # Sent when the recorded gamemode is refused at the return point, so the player stays in survival.
  returnGamemodeDenied: "<gold>You don't have the authority to be in <red><gamemode></red> here, so you stay in survival.</gold>"
  # Sent when the recorded spot is sealed by solid blocks all the way up; the return is refused and kept.
  returnBlocked: "<red>The spot you left is sealed inside solid blocks, so you cannot return there right now.</red>"
spawns:
  global:
    location:
      ==: org.bukkit.Location
      world: world
      x: 0.5
      y: 64.0
      z: -202.5
      pitch: -0.5
      yaw: 90.0
