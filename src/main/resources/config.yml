spawn-on-join: false
myworlds-spawn-sync: true # Push the global spawn into MyWorlds so world spawn matches /setspawn.
respawn-at-home: true
newbies:
  spawnpoint: newbie
login-safety:
  enabled: true
  # Only these SMP dimensions are normalized, and respawns are kept inside them.
  # Add other survival worlds explicitly.
  worlds:
    - world
    - world_nether
    - world_the_end
  autopsy-migration:
    enabled: true
  # Return every non-survival login to survival unless the player is exempt below.
  normalize-non-staff-gamemode: true
  remove-flight-on-normalize: true
  # Fallback rules, used only when GameModeInventories-OG is absent: it is the
  # authority on gamemodes and Spawn-OG asks it first. Holding one of these keeps
  # a creative or spectator login, and only inside the creative regions below (or
  # with gamemodeinventories.anywhere). Adventure is never kept.
  gamemode-exemption-permissions:
    creative:
      - noclip.use
      - gamemodeinventories.toggle
      - gamemodeinventories.anywhere
    spectator:
      - noclip.use
      - gamemodeinventories.spectator
  # Also fallback only. With GameModeInventories-OG loaded, its creative_regions
  # list is what counts.
  creative-regions:
    - spawn
  # LuckPerms-backed permissions. Matching any entry exempts a player from
  # autopsy migration, so a staff spectator is never recorded as an OG:SMP
  # autopsy. Gamemode normalization is governed by the exemptions above.
  staff-bypass-permissions:
    - spawnog.login-migration.bypass
    - staffog.seebroadcast
    - chat-og.staff
    - sv.use
flight:
  enabled: true
  regions:
    spawn: fly
    warzone: nofly
locale:
  # <seconds> is replaced with the teleport warmup length.
  spawnWarmup: "<gold>Teleporting to spawn in <red><seconds> seconds...</red></gold>"
  # Movement cancels the warmup. Taking damage does not.
  spawnCancelled: "<red>Teleport to spawn cancelled because you moved.</red>"
  unsafeLogin: "<gold>You logged in at an unsafe location (<red><x>, <y>, <z></red> in <world>) and were teleported to spawn.</gold>"
  autopsyMigration: "<gold>Your OG:SMP autopsy state was safely migrated from <red><x>, <y>, <z></red> in <world>. You were moved to spawn and returned to survival.</gold>"
  gamemodeNormalized: "<gold>Your login gamemode was safely returned to survival.</gold>"
  loginSafetyFailed: "<red>Your login safety migration could not finish safely. Please contact staff.</red>"
  returnAvailable: "<gold>Run <click:run_command:'/spawnback'><hover:show_text:'<gold>Click to run <red>/spawnback</red></gold>'><red>/spawnback</red></hover></click> if you want to go back there anyway.</gold>"
  # <reason> explains why the location was flagged. <seconds> is the confirmation window.
  returnWarning: "<gold>You were moved from <red><x>, <y>, <z></red> in <world> because <red><reason></red>. Run <click:run_command:'/spawnback confirm'><hover:show_text:'<gold>Click to confirm your return</gold>'><red>/spawnback confirm</red></hover></click> within <seconds> seconds to go back anyway; you may take damage or die.</gold>"
  returnConfirmed: "<gold>Returning you to <red><x>, <y>, <z></red> in <world>. Good luck.</gold>"
  # Sent when the return point forbids flight, or the player may not fly there.
  # Fall damage is cancelled on every return regardless.
  returnFlightDenied: "<gold>Flight could not be restored here. Your landing is cushioned, but nothing else about the spot is.</gold>"
  returnNone: "<red>You have no location to return to.</red>"
  returnWorldMissing: "<red>The world you were in (<world>) is not loaded, so you cannot return there.</red>"
  returnBusy: "<red>Your login is still being made safe. Try again in a few seconds.</red>"
  returnFailed: "<red>Your return teleport failed.</red>"
spawns:
  global:
    location:
      ==: org.bukkit.Location
      world: world
      x: 0.5
      y: 64.0
      z: -202.5
      pitch: -0.5
      yaw: 90.0
